<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Aher - Control en la Nube</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        form { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        input { flex: 1; min-width: 200px; }
        button { background-color: #27ae60; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #219653; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema Aher - Sincronizado en la Nube</h1>

        <!-- SECCIÓN CLIENTES -->
        <div class="section">
            <h2>Gestión de Clientes</h2>
            <form id="formCliente">
                <input type="text" id="nombreCliente" placeholder="Nombre del cliente" required>
                <input type="text" id="telefonoCliente" placeholder="Teléfono" required>
                <button type="submit">Guardar Cliente</button>
            </form>
            <table>
                <thead>
                    <tr><th>Nombre</th><th>Teléfono</th></tr>
                </thead>
                <tbody id="tablaClientes">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- SECCIÓN CAJEROS -->
        <div class="section">
            <h2>Gestión de Cajeros</h2>
            <form id="formCajero">
                <input type="text" id="nombreCajero" placeholder="Nombre del cajero" required>
                <input type="text" id="codigoCajero" placeholder="Código o Usuario" required>
                <button type="submit">Guardar Cajero</button>
            </form>
            <table>
                <thead>
                    <tr><th>Nombre</th><th>Código</th></tr>
                </thead>
                <tbody id="tablaCajeros">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- SECCIÓN JUGADAS -->
        <div class="section">
            <h2>Registro de Jugadas</h2>
            <form id="formJugada">
                <input type="text" id="descJugada" placeholder="Descripción de la jugada" required>
                <input type="number" id="montoJugada" placeholder="Monto" required>
                <button type="submit">Guardar Jugada</button>
            </form>
            <table>
                <thead>
                    <tr><th>Descripción</th><th>Monto</th></tr>
                </thead>
                <tbody id="tablaJugadas">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCRIPT DE FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnFR6D0-bqkKbVWDZykAmf3qiGp7H0mKc",
            authDomain: "sistemasaher.firebaseapp.com",
            projectId: "sistemasaher",
            storageBucket: "sistemasaher.firebasestorage.app",
            messagingSenderId: "794139958426",
            appId: "1:794139958426:web:73d43f097a27331340d323",
            measurementId: "G-LGZRENLCBE"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Función general para guardar datos en cualquier colección
        async function guardarDato(coleccionNombre, datos) {
            try {
                await addDoc(collection(db, coleccionNombre), datos);
            } catch (e) {
                console.error("Error al guardar: ", e);
                alert("Hubo un error al guardar los datos.");
            }
        }

        // --- CLIENTES ---
        document.getElementById("formCliente").addEventListener("submit", (e) => {
            e.preventDefault();
            guardarDato("clientes", {
                nombre: document.getElementById("nombreCliente").value,
                telefono: document.getElementById("telefonoCliente").value,
                fecha: new Date().toISOString()
            });
            e.target.reset();
        });

        onSnapshot(collection(db, "clientes"), (snapshot) => {
            const tabla = document.getElementById("tablaClientes");
            tabla.innerHTML = "";
            snapshot.forEach((doc) => {
                const d = doc.data();
                tabla.innerHTML += `<tr><td>${d.nombre}</td><td>${d.telefono}</td></tr>`;
            });
        });

        // --- CAJEROS ---
        document.getElementById("formCajero").addEventListener("submit", (e) => {
            e.preventDefault();
            guardarDato("cajeros", {
                nombre: document.getElementById("nombreCajero").value,
                codigo: document.getElementById("codigoCajero").value,
                fecha: new Date().toISOString()
            });
            e.target.reset();
        });

        onSnapshot(collection(db, "cajeros"), (snapshot) => {
            const tabla = document.getElementById("tablaCajeros");
            tabla.innerHTML = "";
            snapshot.forEach((doc) => {
                const d = doc.data();
                tabla.innerHTML += `<tr><td>${d.nombre}</td><td>${d.codigo}</td></tr>`;
            });
        });

        // --- JUGADAS ---
        document.getElementById("formJugada").addEventListener("submit", (e) => {
            e.preventDefault();
            guardarDato("jugadas", {
                descripcion: document.getElementById("descJugada").value,
                monto: document.getElementById("montoJugada").value,
                fecha: new Date().toISOString()
            });
            e.target.reset();
        });

        onSnapshot(collection(db, "jugadas"), (snapshot) => {
            const tabla = document.getElementById("tablaJugadas");
            tabla.innerHTML = "";
            snapshot.forEach((doc) => {
                const d = doc.data();
                tabla.innerHTML += `<tr><td>${d.descripcion}</td><td>$${d.monto}</td></tr>`;
            });
        });
    </script>
</body>
</html>
